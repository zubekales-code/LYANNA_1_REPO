# ---------------------------------------------------------------------------
# ZDROJE PROUDU
#
# Sloučeno z RSS_FEEDS.xlsx a vedecke_rss_feedy_35.xlsx, odduplikováno
# (normalizace: bez schématu, bez www., bez koncového lomítka).
#
# Pravidla, podle kterých je seznam sestavený:
#
#  1. Zastřešující ("firehose") feedy jsou vynechané, protože obsahují
#     totéž co tematické feedy pod nimi a jen by zdvojovaly objem:
#       phys.org/rss-feed/ · phys.org/rss-feed/breaking/
#       sciencedaily.com/rss/all.xml · newscientist.com/feed/home/
#     Tematické feedy mají navíc tu výhodu, že z nich jde odvodit
#     default_category, takže triáž má výchozí tip a nehádá od nuly.
#
#  2. arXiv feedy (hep-ex, quant-ph, nucl-ex, physics, hep-th, q-bio) jsou
#     vynechané po dohodě — preprinty bez recenze, objem stovek položek
#     denně, psané pro odborníky. Stejná témata pokrývají Quanta Magazine,
#     Physics World, APS Physics (redakční výběr z Physical Review),
#     PLOS Biology, The Scientist a Cell/Neuron — už protříděná.
#
#  3. openlab-archive-iv-v.web.cern.ch vynechán: podle URL jde o archiv
#     staré verze webu CERN openlab, tedy nejspíš mrtvý feed.
#
# Pole u každého zdroje:
#   name             — lidský název, ukládá se do raw_items.source
#   url              — adresa feedu
#   default_category — výchozí tip pro triáž. Když chybí, triáž rozhoduje
#                      bez nápovědy (u mezioborových zdrojů je to správně).
#   tier             — core / wide / corporate; viz settings.yaml,
#                      slouží k případnému zúžení bez mazání řádků.
#   enabled          — false = zdroj se přeskočí, ale zůstane v evidenci
# ---------------------------------------------------------------------------

